<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>网页嵌入器</title>
    <style>
        /* 重置默认样式 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        /* 主容器布局 */
        .main-container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧webview区域 */
        .webview-container {
            flex: 1;
            height: 100vh;
            position: relative;
        }
        
        /* webview样式 */
        .webview-container webview {
            width: 100%;
            height: 100%;
        }
        
        /* 右侧功能区 */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #f0f0f0;
            border-left: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        /* 功能区标题 */
        .sidebar h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        
        /* 功能按钮容器 */
        .button-container {
            margin-top: 20px;
        }
        
        /* 功能按钮样式 */
        .function-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        /* 按钮悬停效果 */
        .function-button:hover {
            background-color: #45a049;
        }
        
        /* 按钮点击效果 */
        .function-button:active {
            background-color: #3e8e41;
        }
        
        /* 说明文本 */
        .description {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
        
        /* 坐标显示区域 */
        .coordinate-display {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            color: #333;
        }
        
        .coordinate-display h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        
        .coordinate-display p {
            margin: 5px 0;
        }
        
        /* 日志区域 */
        .log-area {
            margin-top: 30px;
            height: 300px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
        }
        
        /* 日志标题 */
        .log-area h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        
        /* 日志内容 */
        #log-content {
            height: calc(100% - 20px);
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            font-family: monospace;
        }
        
        /* 日志条目 */
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
            border-bottom: 1px solid #eee;
        }
        
        /* 时间戳 */
        .log-time {
            color: #999;
            margin-right: 10px;
        }
        
        /* 日志类型样式 */
        .log-info {
            color: #333;
        }
        
        .log-success {
            color: #4CAF50;
        }
        
        .log-error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧webview区域 -->
        <div class="webview-container">
            <webview id="gameWebview" src="https://www.wanyiwan.top/game/xjjdcj" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" plugins="true" allowfullscreen="true"></webview>
        </div>
        
        <!-- 右侧功能区 -->
        <div class="sidebar">
            <h2>功能区</h2>
            
            <div class="button-container">
                <button class="function-button" onclick="handleOneClickRuins()">一键遗迹</button>
                <button class="function-button" onclick="handleRefresh()">刷新页面</button>
                <button class="function-button" onclick="handleFullscreen()">切换全屏</button>
                <button class="function-button" onclick="checkLoginStatus()">检查登录状态</button>
                <button class="function-button" onclick="enableCoordinateSelection()">启用坐标选择</button>
                <button class="function-button" onclick="handleSimulateClick()">模拟点击</button>
            </div>
            
            <div class="description">
                <p>功能说明：</p>
                <p>• 一键遗迹：自动执行遗迹相关操作</p>
                <p>• 刷新页面：重新加载游戏页面</p>
                <p>• 切换全屏：进入或退出全屏模式</p>
                <p>• 检查登录状态：检查当前是否已完全登录成功</p>
                <p>• 启用坐标选择：进入坐标选择模式，点击游戏画面选择位置</p>
                <p>• 模拟点击：在选定的坐标位置执行点击操作</p>
            </div>
            
            <!-- 坐标显示区域 -->
            <div class="coordinate-display">
                <h3>当前选中坐标</h3>
                <p>X: <span id="coordinate-x">0</span></p>
                <p>Y: <span id="coordinate-y">0</span></p>
                <p>状态: <span id="selection-status">未选择</span></p>
            </div>
            
            <!-- 操作日志区域 -->
            <div class="log-area">
                <h3>操作日志</h3>
                <div id="log-content"></div>
            </div>
        </div>
    </div>
    
    <script>
        // 全局变量
        let gameWebview;
        let logContent;
        let isFullscreen = false;
        let isLoggedIn = false;
        let heartbeatInterval = null;
        let selectedX = 0;
        let selectedY = 0;
        let isSelectionMode = false;
        let canvasOriginalWidth = 0;
        let canvasOriginalHeight = 0;
        
        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            // 获取webview元素
            gameWebview = document.getElementById('gameWebview');
            
            // 获取日志容器
            logContent = document.getElementById('log-content');
            
            // 初始化日志系统
            log('应用页面已加载完成', 'success');
            log('日志系统初始化完成，开始监听各种事件', 'info');
            
            // 开始心跳循环检查
            startHeartbeat();
            
            // 绑定事件监听器
            bindEventListeners();
        });
        
        /**
         * 绑定事件监听器
         */
        function bindEventListeners() {
            if (!gameWebview) return;
            
            // 监听webview的全屏变化事件
            gameWebview.addEventListener('enter-html-full-screen', () => {
                console.log('Webview进入全屏');
                isFullscreen = true;
                log('Webview进入全屏状态', 'success');
                log('全屏成功，现在可以执行其他功能操作', 'success');
            });
            
            gameWebview.addEventListener('leave-html-full-screen', () => {
                console.log('Webview退出全屏');
                isFullscreen = false;
                log('Webview退出全屏状态', 'info');
            });
            
            // 监听webview的控制台消息
            gameWebview.addEventListener('console-message', (e) => {
                const message = e.message;
                console.log('Webview控制台:', message);
                
                // 处理坐标选择消息
                if (message.startsWith('COORDINATE: ')) {
                    try {
                        // 解析坐标信息
                        const coords = message.substring('COORDINATE: '.length).split(',');
                        const x = parseInt(coords[0]);
                        const y = parseInt(coords[1]);
                        
                        // 更新选中的坐标
                        selectedX = x;
                        selectedY = y;
                        
                        // 更新坐标显示
                        document.getElementById('coordinate-x').textContent = x;
                        document.getElementById('coordinate-y').textContent = y;
                        document.getElementById('selection-status').textContent = '已选择';
                        
                        // 退出选择模式
                        isSelectionMode = false;
                        
                        // 输出日志
                        log(`坐标选择完成: (${x}, ${y})`, 'success');
                    } catch (error) {
                        log('解析坐标信息时出错: ' + error.message, 'error');
                    }
                }
                // 处理Canvas尺寸消息
                else if (message.startsWith('Canvas尺寸: ')) {
                    try {
                        // 解析尺寸信息
                        const size = message.substring('Canvas尺寸: '.length).split(',');
                        canvasOriginalWidth = parseInt(size[0]);
                        canvasOriginalHeight = parseInt(size[1]);
                        
                        log(`Canvas尺寸记录: ${canvasOriginalWidth}x${canvasOriginalHeight}`, 'info');
                    } catch (error) {
                        log('解析Canvas尺寸信息时出错: ' + error.message, 'error');
                    }
                }
                // 处理其他消息
                else if (message.startsWith('WARNING: ') || message.startsWith('INFO: ') || message.startsWith('ERROR: ') || message.startsWith('SUCCESS: ')) {
                    // 解析消息，根据前缀显示不同类型的日志
                    let displayMessage = message;
                    let type = 'info';
                    
                    // 检查是否带有WARNING前缀
                    if (message.startsWith('WARNING: ')) {
                        displayMessage = message.substring('WARNING: '.length);
                        type = 'warning';
                    } 
                    // 检查是否带有INFO前缀
                    else if (message.startsWith('INFO: ')) {
                        displayMessage = message.substring('INFO: '.length);
                        type = 'info';
                    } 
                    // 检查是否带有ERROR前缀
                    else if (message.startsWith('ERROR: ')) {
                        displayMessage = message.substring('ERROR: '.length);
                        type = 'error';
                    }
                    // 检查是否带有SUCCESS前缀
                    else if (message.startsWith('SUCCESS: ')) {
                        displayMessage = message.substring('SUCCESS: '.length);
                        type = 'success';
                    }
                    
                    // 将webview的控制台消息显示到日志区域
                    log('Webview: ' + displayMessage, type);
                }
            });
            
            // 监听webview的加载开始事件
            gameWebview.addEventListener('did-start-loading', () => {
                log('游戏页面开始加载', 'info');
            });
            
            // 监听webview的加载进度事件
            gameWebview.addEventListener('did-start-navigation', (e) => {
                log('开始导航到: ' + e.url, 'info');
            });
            
            // 监听webview的导航完成事件
            gameWebview.addEventListener('did-navigate', (e) => {
                log('导航完成: ' + e.url, 'success');
            });
            
            // 监听webview的导航失败事件
            gameWebview.addEventListener('did-fail-navigation', (e) => {
                log('导航失败: ' + e.url + ', 错误: ' + e.errorDescription, 'error');
            });
            
            // 监听webview加载完成事件
            gameWebview.addEventListener('did-finish-load', () => {
                log('游戏页面已加载完成', 'success');
                
                // 检查登录状态
                checkLoginStatus();
                
                // 尝试屏蔽浏览器兼容性提示
                gameWebview.executeJavaScript(`
                    try {
                        // 查找浏览器兼容性提示元素
                        const selectors = [
                            '.browser-warning',
                            '.compatibility-warning',
                            '.warning-message',
                            '[class*="warning"]',
                            '[class*="compatible"]'
                        ];
                        
                        let warningElement = null;
                        for (const selector of selectors) {
                            try {
                                warningElement = document.querySelector(selector);
                                if (warningElement) {
                                    console.log('找到浏览器兼容性提示元素:', warningElement);
                                    break;
                                }
                            } catch (e) {
                                // 忽略选择器错误
                            }
                        }
                        
                        // 如果找到了提示元素，隐藏或移除它
                        if (warningElement) {
                            console.log('隐藏浏览器兼容性提示');
                            warningElement.style.display = 'none';
                        } else {
                            console.log('未找到浏览器兼容性提示元素');
                            // 尝试查找所有可能的提示元素
                            const allElements = document.querySelectorAll('div, p, span');
                            for (const element of allElements) {
                                if (element.textContent.includes('当前浏览器暂未兼容') || 
                                    element.textContent.includes('请使用最新的chrome浏览器')) {
                                    console.log('找到提示元素:', element);
                                    element.style.display = 'none';
                                }
                            }
                        }
                    } catch (e) {
                        console.log('ERROR: 屏蔽浏览器兼容性提示时出错: ' + e.message);
                    }
                `);
            });
            
            // 监听webview加载失败事件
            gameWebview.addEventListener('did-fail-load', (event) => {
                // 只有当错误码不是跨域错误时才显示错误提示
                if (!event.errorDescription.includes('ERR_BLOCKED_BY_RESPONSE') && 
                    !event.errorDescription.includes('cross.html')) {
                    log('游戏页面加载失败，请检查网络连接或网址是否正确', 'error');
                } else {
                    log('忽略非关键错误（如支付宝跨域错误），页面可能已正常加载', 'info');
                }
            });
        }
        
        /**
         * 输出日志到右侧功能区
         */
        function log(message, type = 'info') {
            try {
                // 获取当前时间
                const now = new Date();
                const timeStr = now.toLocaleTimeString();
                
                // 创建日志条目
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${type}`;
                
                // 构建日志内容
                logEntry.innerHTML = `<span class="log-time">${timeStr}</span>${message}`;
                
                // 添加到日志容器
                if (logContent) {
                    logContent.appendChild(logEntry);
                    
                    // 滚动到底部
                    logContent.scrollTop = logContent.scrollHeight;
                }
                
                // 同时在控制台输出
                console.log(`${timeStr} [${type.toUpperCase()}] ${message}`);
            } catch (error) {
                console.error('输出日志时出错:', error);
            }
        }
        
        /**
         * 检查登录状态
         */
        function checkLoginStatus() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                gameWebview.executeJavaScript(`
                    try {
                        console.log('检查登录状态');
                        
                        // 检查页面文本内容
                        const pageText = document.body.textContent;
                        const hasGameContent = pageText.includes('等级') || 
                                             pageText.includes('金币') || 
                                             pageText.includes('钻石') || 
                                             pageText.includes('巡逻') || 
                                             pageText.includes('发现') || 
                                             pageText.includes('商店') || 
                                             pageText.includes('英雄');
                        
                        // 检查是否存在登录相关内容
                        const hasLoginContent = pageText.includes('登录') || 
                                               pageText.includes('扫码') || 
                                               pageText.includes('二维码');
                        
                        console.log('游戏元素存在:', true);
                        console.log('页面包含游戏内容:', hasGameContent);
                        console.log('页面包含登录内容:', hasLoginContent);
                        
                        // 判断是否登录成功
                        if (hasGameContent && !hasLoginContent) {
                            console.log('SUCCESS: 登录成功，游戏界面已完全加载');
                        } else if (hasLoginContent) {
                            console.log('WARNING: 页面仍显示登录相关内容，请继续完成登录');
                        } else {
                            console.log('INFO: 页面状态未知，可能正在加载中');
                        }
                    } catch (e) {
                        console.log('ERROR: 检查登录状态时出错: ' + e.message);
                    }
                `);
            } catch (error) {
                log('检查登录状态时出错: ' + error.message, 'error');
            }
        }
        
        /**
         * 一键遗迹功能
         */
        function handleOneClickRuins() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                // 检查游戏内是否已全屏
                gameWebview.executeJavaScript(`
                    try {
                        const fullscreenBtn = document.querySelector('.fullScreenBtn-Ft-goHEv');
                        let isFullscreen = false;
                        if (fullscreenBtn) {
                            const spanElement = fullscreenBtn.querySelector('span');
                            if (spanElement && spanElement.textContent.includes('退出全屏')) {
                                isFullscreen = true;
                            }
                        }
                        
                        if (isFullscreen) {
                            console.log('执行一键遗迹操作');
                            // 这里可以添加具体的遗迹操作代码
                            console.log('SUCCESS: 一键遗迹操作已执行');
                        } else {
                            console.log('WARNING: 请先等待游戏内全屏后再执行此操作');
                        }
                    } catch (e) {
                        console.log('ERROR: 执行一键遗迹操作时出错: ' + e.message);
                    }
                `);
                
                // 提示用户操作已执行
                log('已尝试执行一键遗迹操作', 'success');
            } catch (error) {
                log('执行一键遗迹操作时出错: ' + error.message, 'error');
                log('执行操作时出错，请确保游戏页面已完全加载', 'error');
            }
        }
        
        /**
         * 刷新页面功能
         */
        function handleRefresh() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                log('刷新页面', 'info');
                gameWebview.src = gameWebview.src;
            } catch (error) {
                log('刷新页面时出错: ' + error.message, 'error');
            }
        }
        
        /**
         * 触发游戏内全屏按钮
         */
        function handleFullscreen() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                log('开始执行全屏操作', 'info');
                // 在webview中执行脚本，点击游戏内的全屏按钮
                gameWebview.executeJavaScript(`
                    try {
                        console.log('开始执行全屏操作');
                        
                        // 查找游戏内的全屏按钮
                        const fullscreenBtn = document.querySelector('.fullScreenBtn-Ft-goHEv');
                        
                        if (fullscreenBtn) {
                            console.log('找到游戏内全屏按钮');
                            
                            // 检查全屏按钮状态
                            let isFullscreen = false;
                            const spanElement = fullscreenBtn.querySelector('span');
                            if (spanElement && spanElement.textContent.includes('退出全屏')) {
                                isFullscreen = true;
                                console.log('当前状态: 已全屏，准备退出全屏');
                            } else {
                                console.log('当前状态: 未全屏，准备进入全屏');
                            }
                            
                            // 点击全屏按钮
                            fullscreenBtn.click();
                            console.log('已点击游戏内全屏按钮');
                        } else {
                            console.log('未找到游戏内全屏按钮');
                            // 检查是否存在登录相关内容
                            const pageText = document.body.textContent.toLowerCase();
                            if (pageText.includes('登录') || pageText.includes('扫码') || pageText.includes('二维码')) {
                                console.log('WARNING: 当前页面需要登录，请先完成登录后再尝试使用全屏功能');
                            } else {
                                console.log('ERROR: 未找到游戏内全屏按钮，且页面似乎不是登录页面');
                            }
                        }
                    } catch (e) {
                        console.log('ERROR: 执行全屏操作时出错: ' + e.message);
                    }
                `);
                
                // 提示用户操作已执行
                log('已尝试触发游戏内全屏功能', 'success');
            } catch (error) {
                log('执行全屏操作时出错: ' + error.message, 'error');
                log('执行全屏操作时出错，请确保游戏页面已完全加载', 'error');
            }
        }
        
        /**
         * 心跳循环检查登录状态和全屏按钮状态
         */
        function startHeartbeat() {
            // 清除之前的心跳
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
            }
            
            // 每3秒检查一次
            heartbeatInterval = setInterval(() => {
                checkLoginAndFullscreenStatus();
            }, 3000);
            
            log('开始心跳循环检查登录状态和全屏按钮状态', 'info');
        }
        
        /**
         * 检查登录状态和全屏按钮状态
         */
        function checkLoginAndFullscreenStatus() {
            try {
                if (!gameWebview) return;
                
                gameWebview.executeJavaScript(`
                    try {
                        console.log('心跳检查：登录状态和全屏按钮');
                        
                        // 检查是否存在全屏按钮
                        const fullscreenBtn = document.querySelector('.fullScreenBtn-Ft-goHEv');
                        console.log('全屏按钮存在:', !!fullscreenBtn);
                        
                        // 检查全屏按钮状态
                        let isFullscreen = false;
                        if (fullscreenBtn) {
                            const spanElement = fullscreenBtn.querySelector('span');
                            if (spanElement && spanElement.textContent.includes('退出全屏')) {
                                isFullscreen = true;
                                console.log('当前状态: 已全屏');
                            } else {
                                console.log('当前状态: 未全屏');
                            }
                        }
                        
                        // 检查页面文本内容
                        const pageText = document.body.textContent;
                        
                        // 检查是否存在登录相关内容
                        const hasLoginContent = pageText.includes('登录') || 
                                               pageText.includes('扫码') || 
                                               pageText.includes('二维码');
                        
                        // 检查是否存在游戏相关内容
                        const hasGameContent = pageText.includes('等级') || 
                                             pageText.includes('金币') || 
                                             pageText.includes('钻石') || 
                                             pageText.includes('巡逻') || 
                                             pageText.includes('发现') || 
                                             pageText.includes('商店') || 
                                             pageText.includes('英雄') ||
                                             pageText.includes('基地') ||
                                             pageText.includes('空港') ||
                                             pageText.includes('舰队');
                        
                        // 检查是否存在加载页面特征
                        const isLoadingPage = pageText.includes('小鸡出击') && !hasGameContent;
                        
                        console.log('页面包含登录内容:', hasLoginContent);
                        console.log('页面包含游戏内容:', hasGameContent);
                        console.log('是否加载页面:', isLoadingPage);
                        
                        // 判断登录状态
                        if (hasGameContent && !hasLoginContent && !isLoadingPage) {
                            console.log('SUCCESS: 登录成功，游戏界面已完全加载');
                            
                            // 如果存在全屏按钮且未全屏，则点击全屏按钮
                            if (fullscreenBtn && !isFullscreen) {
                                console.log('INFO: 发现全屏按钮且未全屏，准备点击');
                                fullscreenBtn.click();
                                console.log('INFO: 已点击全屏按钮');
                            }
                        } else if (isLoadingPage) {
                            console.log('INFO: 页面正在加载中');
                        } else if (hasLoginContent) {
                            console.log('WARNING: 页面仍显示登录相关内容，请继续完成登录');
                        } else {
                            console.log('INFO: 页面状态未知');
                        }
                    } catch (e) {
                        console.log('ERROR: 心跳检查时出错: ' + e.message);
                    }
                `);
            } catch (error) {
                log('心跳检查时出错: ' + error.message, 'error');
            }
        }
        
        /**
         * 启用坐标选择模式
         */
        function enableCoordinateSelection() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                // 检查游戏内是否已全屏
                gameWebview.executeJavaScript(`
                    try {
                        const fullscreenBtn = document.querySelector('.fullScreenBtn-Ft-goHEv');
                        let isFullscreen = false;
                        if (fullscreenBtn) {
                            const spanElement = fullscreenBtn.querySelector('span');
                            if (spanElement && spanElement.textContent.includes('退出全屏')) {
                                isFullscreen = true;
                            }
                        }
                        
                        if (isFullscreen) {
                            console.log('进入坐标选择模式，请点击游戏画面选择位置');
                            
                            // 查找canvas元素
                            const canvas = document.querySelector('canvas');
                            if (canvas) {
                                // 记录canvas原始尺寸
                                window.canvasOriginalWidth = canvas.width;
                                window.canvasOriginalHeight = canvas.height;
                                console.log('Canvas原始尺寸:', canvas.width, 'x', canvas.height);
                                
                                // 创建透明覆盖层
                                const overlay = document.createElement('div');
                                overlay.id = 'coordinate-selection-overlay';
                                overlay.style.position = 'absolute';
                                overlay.style.top = '0';
                                overlay.style.left = '0';
                                overlay.style.width = '100%';
                                overlay.style.height = '100%';
                                overlay.style.backgroundColor = 'rgba(0, 255, 0, 0.2)';
                                overlay.style.zIndex = '9999';
                                overlay.style.cursor = 'crosshair';
                                overlay.style.display = 'flex';
                                overlay.style.alignItems = 'center';
                                overlay.style.justifyContent = 'center';
                                overlay.innerHTML = '<div style="background-color: rgba(0, 0, 0, 0.7); color: white; padding: 10px; border-radius: 5px;">点击游戏画面选择坐标位置</div>';
                                
                                // 添加到页面
                                document.body.appendChild(overlay);
                                
                                // 创建鼠标位置指示器
                                const cursorIndicator = document.createElement('div');
                                cursorIndicator.id = 'cursor-indicator';
                                cursorIndicator.style.position = 'absolute';
                                cursorIndicator.style.width = '20px';
                                cursorIndicator.style.height = '20px';
                                cursorIndicator.style.border = '2px solid #ff0000';
                                cursorIndicator.style.borderRadius = '50%';
                                cursorIndicator.style.pointerEvents = 'none';
                                cursorIndicator.style.zIndex = '10000';
                                cursorIndicator.style.transform = 'translate(-50%, -50%)';
                                cursorIndicator.style.backgroundColor = 'rgba(255, 0, 0, 0.3)';
                                overlay.appendChild(cursorIndicator);
                                
                                // 添加鼠标移动事件监听器，更新指示器位置
                                overlay.addEventListener('mousemove', function(e) {
                                    cursorIndicator.style.left = e.clientX + 'px';
                                    cursorIndicator.style.top = e.clientY + 'px';
                                });
                                
                                // 添加点击事件监听器
                                overlay.addEventListener('click', function(e) {
                                    // 计算相对于canvas的坐标
                                    const rect = canvas.getBoundingClientRect();
                                    const x = e.clientX - rect.left;
                                    const y = e.clientY - rect.top;
                                    
                                    console.log('选择的坐标:', x, y);
                                    
                                    // 输出带前缀的坐标信息，以便主进程捕获
                                    console.log('COORDINATE: ' + x + ',' + y);
                                    console.log('Canvas尺寸: ' + canvas.width + ',' + canvas.height);
                                    
                                    // 添加点击动画效果
                                    const clickEffect = document.createElement('div');
                                    clickEffect.style.position = 'absolute';
                                    clickEffect.style.left = e.clientX + 'px';
                                    clickEffect.style.top = e.clientY + 'px';
                                    clickEffect.style.width = '40px';
                                    clickEffect.style.height = '40px';
                                    clickEffect.style.border = '2px solid #00ff00';
                                    clickEffect.style.borderRadius = '50%';
                                    clickEffect.style.pointerEvents = 'none';
                                    clickEffect.style.zIndex = '10001';
                                    clickEffect.style.transform = 'translate(-50%, -50%) scale(0)';
                                    clickEffect.style.animation = 'clickEffect 0.5s ease-out forwards';
                                    overlay.appendChild(clickEffect);
                                    
                                    // 添加动画样式
                                    const style = document.createElement('style');
                                    style.textContent = '@keyframes clickEffect {0% {transform: translate(-50%, -50%) scale(0); opacity: 1;} 100% {transform: translate(-50%, -50%) scale(1.5); opacity: 0;}}';
                                    document.head.appendChild(style);
                                    
                                    // 移除覆盖层
                                    setTimeout(function() {
                                        document.body.removeChild(overlay);
                                        document.head.removeChild(style);
                                        console.log('坐标选择完成，移除覆盖层');
                                    }, 500);
                                });
                            } else {
                                console.log('未找到canvas元素');
                                console.log('ERROR: 未找到canvas元素');
                            }
                        } else {
                            console.log('WARNING: 请先等待游戏内全屏后再执行此操作');
                        }
                    } catch (e) {
                        console.log('添加覆盖层时出错:', e.message);
                        console.log('ERROR: 添加覆盖层时出错: ' + e.message);
                    }
                `);
                
                // 更新状态显示
                document.getElementById('selection-status').textContent = '选择中...';
                
                // 提示用户操作已执行
                log('已尝试进入坐标选择模式', 'success');
            } catch (error) {
                log('启用坐标选择模式时出错: ' + error.message, 'error');
            }
        }
        
        /**
         * 模拟点击函数
         */
        function handleSimulateClick() {
            try {
                if (!gameWebview) {
                    log('Webview未初始化', 'error');
                    return;
                }
                
                // 检查是否已选择坐标
                if (selectedX === 0 && selectedY === 0) {
                    log('请先选择坐标位置', 'warning');
                    return;
                }
                
                log(`开始执行模拟点击操作，坐标: (${selectedX}, ${selectedY})`, 'info');
                
                // 在webview中执行脚本，模拟点击
                const x = selectedX;
                const y = selectedY;
                gameWebview.executeJavaScript(`
                    try {
                        // 检查游戏内是否已全屏
                        const fullscreenBtn = document.querySelector('.fullScreenBtn-Ft-goHEv');
                        let isFullscreen = false;
                        if (fullscreenBtn) {
                            const spanElement = fullscreenBtn.querySelector('span');
                            if (spanElement && spanElement.textContent.includes('退出全屏')) {
                                isFullscreen = true;
                            }
                        }
                        
                        if (isFullscreen) {
                            console.log('执行模拟点击操作');
                            
                            // 查找canvas元素
                            const canvas = document.querySelector('canvas');
                            if (canvas) {
                                console.log('找到canvas元素');
                                
                                // 获取canvas当前尺寸
                                const currentWidth = canvas.width;
                                const currentHeight = canvas.height;
                                console.log('当前Canvas尺寸:', currentWidth, 'x', currentHeight);
                                
                                // 获取canvas原始尺寸
                                const originalWidth = window.canvasOriginalWidth || currentWidth;
                                const originalHeight = window.canvasOriginalHeight || currentHeight;
                                console.log('原始Canvas尺寸:', originalWidth, 'x', originalHeight);
                                
                                // 计算缩放比例
                                const scaleX = currentWidth / originalWidth;
                                const scaleY = currentHeight / originalHeight;
                                console.log('缩放比例:', scaleX, scaleY);
                                
                                // 转换坐标
                                const x = ${x} * scaleX;
                                const y = ${y} * scaleY;
                                console.log('转换后坐标:', x, y);
                                
                                // 创建鼠标事件
                                const mouseEvent = new MouseEvent('click', {
                                    bubbles: true,
                                    cancelable: true,
                                    clientX: x,
                                    clientY: y,
                                    screenX: x,
                                    screenY: y,
                                    pageX: x,
                                    pageY: y,
                                    offsetX: x,
                                    offsetY: y,
                                    button: 0,
                                    buttons: 1,
                                    view: window
                                });
                                
                                // 触发点击事件
                                canvas.dispatchEvent(mouseEvent);
                                console.log('已触发canvas点击事件');
                                
                                // 同时尝试触发mousedown和mouseup事件，模拟完整的点击过程
                                const mouseDownEvent = new MouseEvent('mousedown', {
                                    bubbles: true,
                                    cancelable: true,
                                    clientX: x,
                                    clientY: y,
                                    button: 0,
                                    buttons: 1,
                                    view: window
                                });
                                
                                const mouseUpEvent = new MouseEvent('mouseup', {
                                    bubbles: true,
                                    cancelable: true,
                                    clientX: x,
                                    clientY: y,
                                    button: 0,
                                    buttons: 0,
                                    view: window
                                });
                                
                                canvas.dispatchEvent(mouseDownEvent);
                                setTimeout(() => {
                                    canvas.dispatchEvent(mouseUpEvent);
                                    console.log('已触发完整的鼠标点击事件');
                                }, 50);
                                
                            } else {
                                console.log('未找到canvas元素');
                                console.log('ERROR: 未找到canvas元素');
                            }
                        } else {
                            console.log('WARNING: 请先等待游戏内全屏后再执行此操作');
                        }
                    } catch (e) {
                        console.log('执行模拟点击时出错:', e.message);
                        console.log('ERROR: 执行模拟点击时出错: ' + e.message);
                    }
                `);
                
                // 提示用户操作已执行
                log(`模拟点击操作已执行，坐标: (${selectedX}, ${selectedY})`, 'success');
            } catch (error) {
                log('执行模拟点击操作时出错: ' + error.message, 'error');
                log('执行操作时出错，请确保游戏页面已完全加载', 'error');
            }
        }
    </script>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>网页嵌入器</title>
    <style>
        /* 重置默认样式 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        /* 主容器布局 */
        .main-container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧iframe区域 */
        .iframe-container {
            flex: 1;
            height: 100vh;
            position: relative;
        }
        
        /* iframe样式 */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 右侧功能区 */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #f0f0f0;
            border-left: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        /* 功能区标题 */
        .sidebar h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        
        /* 功能按钮容器 */
        .button-container {
            margin-top: 20px;
        }
        
        /* 功能按钮样式 */
        .function-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        /* 按钮悬停效果 */
        .function-button:hover {
            background-color: #45a049;
        }
        
        /* 按钮点击效果 */
        .function-button:active {
            background-color: #3e8e41;
        }
        
        /* 说明文本 */
        .description {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧iframe区域 -->
        <div class="iframe-container">
            <iframe id="gameFrame" src="https://www.wanyiwan.top/game/xjjdcj" onerror="handleIframeError(event)"></iframe>
        </div>
        
        <!-- 右侧功能区 -->
        <div class="sidebar">
            <h2>功能区</h2>
            
            <div class="button-container">
                <button class="function-button" onclick="handleOneClickRuins()">一键遗迹</button>
                <button class="function-button" onclick="handleRefresh()">刷新页面</button>
                <button class="function-button" onclick="handleFullscreen()">切换全屏</button>
            </div>
            
            <div class="description">
                <p>功能说明：</p>
                <p>• 一键遗迹：自动执行遗迹相关操作</p>
                <p>• 刷新页面：重新加载游戏页面</p>
                <p>• 切换全屏：进入或退出全屏模式</p>
            </div>
        </div>
    </div>
    
    <script>
        // 获取iframe元素
        const gameFrame = document.getElementById('gameFrame');
        
        /**
         * 一键遗迹功能
         */
        function handleOneClickRuins() {
            try {
                // 获取iframe中的文档对象
                const iframeDoc = gameFrame.contentDocument || gameFrame.contentWindow.document;
                
                // 这里需要根据实际网页的DOM结构来实现具体的操作
                // 示例：查找并点击遗迹相关按钮
                console.log('执行一键遗迹操作');
                
                // 提示用户操作已执行
                alert('一键遗迹操作已执行');
            } catch (error) {
                console.error('执行一键遗迹操作时出错:', error);
                alert('执行操作时出错，请确保游戏页面已完全加载');
            }
        }
        
        /**
         * 刷新页面功能
         */
        function handleRefresh() {
            gameFrame.src = gameFrame.src;
        }
        
        /**
         * 切换全屏功能
         */
        function handleFullscreen() {
            // 在Electron中，使用remote模块来控制窗口全屏
            if (typeof require !== 'undefined') {
                try {
                    const { remote } = require('electron');
                    const win = remote.getCurrentWindow();
                    
                    if (win.isFullScreen()) {
                        win.setFullScreen(false);
                    } else {
                        win.setFullScreen(true);
                    }
                } catch (error) {
                    console.error('使用Electron API切换全屏时出错:', error);
                    // 备用方案：使用浏览器API
                    toggleBrowserFullscreen();
                }
            } else {
                // 在普通浏览器中使用浏览器API
                toggleBrowserFullscreen();
            }
        }
        
        /**
         * 使用浏览器API切换全屏
         */
        function toggleBrowserFullscreen() {
            const mainContainer = document.querySelector('.main-container');
            
            if (!document.fullscreenElement) {
                // 进入全屏
                if (mainContainer.requestFullscreen) {
                    mainContainer.requestFullscreen();
                } else if (mainContainer.mozRequestFullScreen) {
                    mainContainer.mozRequestFullScreen();
                } else if (mainContainer.webkitRequestFullscreen) {
                    mainContainer.webkitRequestFullscreen();
                } else if (mainContainer.msRequestFullscreen) {
                    mainContainer.msRequestFullscreen();
                }
            } else {
                // 退出全屏
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // 监听iframe加载完成事件
        gameFrame.onload = function() {
            console.log('游戏页面已加载完成');
        };
        
        /**
         * 处理iframe加载错误
         */
        function handleIframeError(event) {
            console.error('iframe加载错误:', event);
            alert('游戏页面加载失败，请检查网络连接或网址是否正确');
        }
        
        // 手动触发iframe加载，确保src被正确设置
        setTimeout(function() {
            console.log('手动触发iframe加载，当前src:', gameFrame.src);
            gameFrame.src = gameFrame.src;
        }, 1000);
    </script>
</body>
</html>
